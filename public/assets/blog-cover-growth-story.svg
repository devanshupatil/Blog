<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a07"/>
      <stop offset="100%" style="stop-color:#1e1008"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1510;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1c0e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e07b39;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#e07b39;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e07b39;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow top -->
  <ellipse cx="600" cy="0" rx="500" ry="200" fill="#e07b39" opacity="0.06" filter="url(#blur)"/>

  <!-- Grid lines subtle -->
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Orange glow strip center -->
  <rect x="0" y="290" width="1200" height="50" fill="url(#glow)"/>

  <!-- ── Project Cards ── -->

  <!-- Card 1: Marriage Biodata Builder -->
  <g transform="translate(60, 130)">
    <rect width="240" height="150" rx="10" fill="url(#card1)" stroke="#e07b39" stroke-width="1" opacity="0.9"/>
    <rect width="4" height="150" rx="2" fill="#e07b39"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="11" fill="#e07b39" letter-spacing="2" opacity="0.8">01</text>
    <text x="20" y="58" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Biodata</text>
    <text x="20" y="78" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Builder</text>
    <text x="20" y="108" font-family="Inter, sans-serif" font-size="11" fill="#c4a882">jsPDF · html2canvas</text>
    <text x="20" y="126" font-family="Inter, sans-serif" font-size="11" fill="#c4a882">React · TailwindCSS</text>
    <text x="20" y="144" font-family="Inter, sans-serif" font-size="10" fill="#e07b39" opacity="0.7">Client-side PDF rendering</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(308, 195)">
    <line x1="0" y1="10" x2="54" y2="10" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="54,5 66,10 54,15" fill="#e07b39" opacity="0.6"/>
  </g>

  <!-- Card 2: Sagar-Shop -->
  <g transform="translate(382, 130)">
    <rect width="240" height="150" rx="10" fill="url(#card1)" stroke="#e07b39" stroke-width="1" opacity="0.9"/>
    <rect width="4" height="150" rx="2" fill="#e07b39"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="11" fill="#e07b39" letter-spacing="2" opacity="0.8">02</text>
    <text x="20" y="58" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Sagar</text>
    <text x="20" y="78" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Shop</text>
    <text x="20" y="108" font-family="Inter, sans-serif" font-size="11" fill="#c4a882">Redux · Supabase · JWT</text>
    <text x="20" y="126" font-family="Inter, sans-serif" font-size="11" fill="#c4a882">Node.js · Express</text>
    <text x="20" y="144" font-family="Inter, sans-serif" font-size="10" fill="#e07b39" opacity="0.7">Full-stack e-commerce</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(630, 195)">
    <line x1="0" y1="10" x2="54" y2="10" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="54,5 66,10 54,15" fill="#e07b39" opacity="0.6"/>
  </g>

  <!-- Card 3: TimeStream -->
  <g transform="translate(704, 130)">
    <rect width="240" height="150" rx="10" fill="url(#card1)" stroke="#e07b39" stroke-width="1" opacity="0.9"/>
    <rect width="4" height="150" rx="2" fill="#e07b39"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="11" fill="#e07b39" letter-spacing="2" opacity="0.8">03</text>
    <text x="20" y="58" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Time</text>
    <text x="20" y="78" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Stream</text>
    <text x="20" y="108" font-family="Inter, sans-serif" font-size="11" fill="#c4a882">Electron · SQLite</text>
    <text x="20" y="126" font-family="Inter, sans-serif" font-size="11" fill="#c4a882">chokidar · Extension</text>
    <text x="20" y="144" font-family="Inter, sans-serif" font-size="10" fill="#e07b39" opacity="0.7">Desktop + browser ext</text>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(952, 195)">
    <line x1="0" y1="10" x2="54" y2="10" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="54,5 66,10 54,15" fill="#e07b39" opacity="0.6"/>
  </g>

  <!-- Card 4: LMS -->
  <g transform="translate(1014, 80)">
    <rect width="148" height="200" rx="10" fill="#2a1505" stroke="#e07b39" stroke-width="1.5"/>
    <rect width="4" height="200" rx="2" fill="#e07b39"/>
    <!-- Glow behind card 4 -->
    <rect x="-10" y="-10" width="168" height="220" rx="12" fill="#e07b39" opacity="0.04"/>
    <text x="18" y="30" font-family="Georgia, serif" font-size="11" fill="#e07b39" letter-spacing="2" opacity="0.9">04</text>
    <text x="18" y="58" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Online</text>
    <text x="18" y="78" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Learning</text>
    <text x="18" y="98" font-family="Georgia, serif" font-size="16" fill="#fdf6ee" font-weight="bold">Portal</text>
    <text x="18" y="128" font-family="Inter, sans-serif" font-size="10" fill="#c4a882">GPT-4o · Claude</text>
    <text x="18" y="146" font-family="Inter, sans-serif" font-size="10" fill="#c4a882">Gemini · Perplexity</text>
    <text x="18" y="164" font-family="Inter, sans-serif" font-size="10" fill="#c4a882">Docker · Terraform</text>
    <text x="18" y="188" font-family="Inter, sans-serif" font-size="9" fill="#e07b39">AI-powered LMS</text>
  </g>

  <!-- ── Title section ── -->
  <!-- Subtle separator line -->
  <line x1="60" y1="340" x2="1140" y2="340" stroke="#e07b39" stroke-width="0.5" opacity="0.2"/>

  <!-- Main title -->
  <text x="60" y="400" font-family="Georgia, serif" font-size="42" fill="#fdf6ee" font-weight="bold" letter-spacing="-0.5">4 Projects. Here's How They Made</text>
  <text x="60" y="452" font-family="Georgia, serif" font-size="42" fill="#fdf6ee" font-weight="bold" letter-spacing="-0.5">Me a <tspan fill="#e07b39">Better Developer.</tspan></text>

  <!-- Subtitle -->
  <text x="60" y="500" font-family="Inter, sans-serif" font-size="17" fill="#c4a882" letter-spacing="0.3">A growth story across real-world builds — what tutorials could never teach.</text>

  <!-- Author + blog URL -->
  <circle cx="72" cy="556" r="16" fill="#2a1505" stroke="#e07b39" stroke-width="1"/>
  <text x="72" y="561" font-family="Georgia, serif" font-size="12" fill="#e07b39" text-anchor="middle" font-weight="bold">D</text>
  <text x="98" y="561" font-family="Inter, sans-serif" font-size="14" fill="#7c5c3e">Devanshu Patil  ·  blogbydevanshu.netlify.app</text>

  <!-- Top-right tag -->
  <rect x="1060" y="40" width="110" height="28" rx="14" fill="#e07b39" opacity="0.12" stroke="#e07b39" stroke-width="0.8"/>
  <text x="1115" y="59" font-family="Inter, sans-serif" font-size="12" fill="#e07b39" text-anchor="middle" letter-spacing="1">CAREER</text>
</svg>
