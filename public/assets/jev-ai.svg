<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">What is Jev AI?</title>
  <desc id="desc">Jev turns a customer message into three typed decisions with confidence scores: billing yes 97%, department billing 95%, urgency today.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b12"/>
      <stop offset="100%" stop-color="#0b1622"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101d2b"/>
      <stop offset="100%" stop-color="#0d1824"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3c5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3c5"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="300" rx="320" ry="240" fill="#22d3c5" opacity="0.08" filter="url(#blur)"/>
  <ellipse cx="150" cy="620" rx="300" ry="160" fill="#3b82f6" opacity="0.07" filter="url(#blur)"/>

  <!-- Dot grid -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="660" cy="40" r="1.5"/><circle cx="700" cy="40" r="1.5"/><circle cx="740" cy="40" r="1.5"/><circle cx="780" cy="40" r="1.5"/><circle cx="820" cy="40" r="1.5"/><circle cx="860" cy="40" r="1.5"/><circle cx="900" cy="40" r="1.5"/><circle cx="940" cy="40" r="1.5"/><circle cx="980" cy="40" r="1.5"/><circle cx="1020" cy="40" r="1.5"/><circle cx="1060" cy="40" r="1.5"/><circle cx="1100" cy="40" r="1.5"/><circle cx="1140" cy="40" r="1.5"/>
    <circle cx="660" cy="600" r="1.5"/><circle cx="700" cy="600" r="1.5"/><circle cx="740" cy="600" r="1.5"/><circle cx="780" cy="600" r="1.5"/><circle cx="820" cy="600" r="1.5"/><circle cx="860" cy="600" r="1.5"/><circle cx="900" cy="600" r="1.5"/><circle cx="940" cy="600" r="1.5"/><circle cx="980" cy="600" r="1.5"/><circle cx="1020" cy="600" r="1.5"/><circle cx="1060" cy="600" r="1.5"/><circle cx="1100" cy="600" r="1.5"/><circle cx="1140" cy="600" r="1.5"/>
  </g>

  <!-- Left: headline -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="72" y="118" width="214" height="34" rx="17" fill="#22d3c5" fill-opacity="0.12" stroke="#22d3c5" stroke-opacity="0.4"/>
    <text x="179" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#5eead4" letter-spacing="2">SYSTEM ONE MODEL</text>

    <text x="70" y="240" font-size="68" font-weight="800" fill="#f1f5f9">What is</text>
    <text x="70" y="320" font-size="84" font-weight="800" fill="url(#chip)">Jev AI?</text>

    <text x="72" y="380" font-size="26" fill="#94a3b8">The AI that decides,</text>
    <text x="72" y="414" font-size="26" fill="#94a3b8">instead of chatting.</text>

    <g font-size="17" fill="#cbd5e1">
      <rect x="72" y="470" width="128" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="136" y="496" text-anchor="middle">⚡ ~70 ms</text>
      <rect x="212" y="470" width="150" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="287" y="496" text-anchor="middle">🎯 Calibrated</text>
      <rect x="374" y="470" width="140" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="444" y="496" text-anchor="middle">💸 Output free</text>
    </g>

    <text x="72" y="566" font-size="16" fill="#64748b" letter-spacing="1">BY TYPESAFE AI</text>
  </g>

  <!-- Right: decision flow -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Input state -->
    <rect x="660" y="56" width="470" height="92" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="684" y="86" font-size="13" font-weight="600" fill="#64748b" letter-spacing="2">STATE</text>
    <text x="684" y="118" font-size="18" fill="#e2e8f0">"Charged twice, need a refund by Friday!"</text>

    <!-- Connector to Jev -->
    <line x1="895" y1="148" x2="895" y2="186" stroke="#22d3c5" stroke-width="2" stroke-dasharray="4 5" opacity="0.7"/>

    <!-- Jev chip -->
    <rect x="815" y="186" width="160" height="58" rx="29" fill="url(#chip)"/>
    <text x="895" y="224" text-anchor="middle" font-size="26" font-weight="800" fill="#04121a">Jev</text>

    <!-- Fan-out connectors -->
    <g stroke="#22d3c5" stroke-width="2" fill="none" opacity="0.5">
      <path d="M895 244 V268"/>
      <path d="M740 268 H1050"/>
      <path d="M740 268 V284"/><path d="M895 268 V284"/><path d="M1050 268 V284"/>
    </g>

    <!-- Output: Noul -->
    <rect x="660" y="292" width="470" height="80" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="684" y="322" font-size="13" font-weight="600" fill="#5eead4" letter-spacing="2">NOUL · About billing?</text>
    <rect x="684" y="340" width="330" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="684" y="340" width="320" height="10" rx="5" fill="url(#bar)"/>
    <text x="1106" y="351" text-anchor="end" font-size="20" font-weight="700" fill="#f1f5f9">97% yes</text>

    <!-- Output: Choice -->
    <rect x="660" y="384" width="470" height="80" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="684" y="414" font-size="13" font-weight="600" fill="#5eead4" letter-spacing="2">CHOICE · Department</text>
    <g font-size="15" font-weight="600">
      <rect x="684" y="428" width="92" height="26" rx="13" fill="#22d3c5" fill-opacity="0.2" stroke="#22d3c5"/>
      <text x="730" y="446" text-anchor="middle" fill="#5eead4">billing</text>
      <rect x="786" y="428" width="104" height="26" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="838" y="446" text-anchor="middle" fill="#64748b">technical</text>
      <rect x="900" y="428" width="76" height="26" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="938" y="446" text-anchor="middle" fill="#64748b">sales</text>
    </g>
    <text x="1106" y="447" text-anchor="end" font-size="20" font-weight="700" fill="#f1f5f9">95%</text>

    <!-- Output: Score -->
    <rect x="660" y="476" width="470" height="80" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="684" y="506" font-size="13" font-weight="600" fill="#5eead4" letter-spacing="2">SCORE · Urgency</text>
    <rect x="684" y="524" width="104" height="10" rx="5" fill="#22d3c5" fill-opacity="0.25"/>
    <rect x="796" y="524" width="104" height="10" rx="5" fill="#22d3c5" fill-opacity="0.5"/>
    <rect x="908" y="524" width="104" height="10" rx="5" fill="url(#bar)"/>
    <text x="1106" y="535" text-anchor="end" font-size="20" font-weight="700" fill="#f1f5f9">today</text>
  </g>
</svg>
